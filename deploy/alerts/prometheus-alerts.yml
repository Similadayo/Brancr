groups:
  - name: brancr_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 0.1)"

      # High latency (p95)
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)"

      # Database connection pool exhaustion
      - alert: DatabasePoolExhausted
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of connections in use"

      # Circuit breaker open
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is open"
          description: "Circuit breaker has been open for {{ $for }}"

      # Quota exhaustion
      - alert: QuotaExhausted
        expr: (tenant_quota_ai_calls_used / tenant_quota_ai_calls_limit) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tenant quota nearly exhausted"
          description: "Tenant {{ $labels.tenant_id }} has used {{ $value | humanizePercentage }} of AI call quota"

      # Worker pool queue depth
      - alert: WorkerPoolQueueFull
        expr: worker_pool_queue_depth / worker_pool_queue_size > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker pool queue nearly full"
          description: "{{ $labels.pool }} queue is {{ $value | humanizePercentage }} full"

      # Slow database queries
      - alert: SlowDatabaseQueries
        expr: rate(db_slow_queries_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of slow database queries"
          description: "{{ $value }} slow queries/sec detected"

      # High database error rate
      - alert: HighDatabaseErrorRate
        expr: rate(db_errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High database error rate"
          description: "{{ $value }} database errors/sec (threshold: 0.05)"

      # Rate limit violations
      - alert: HighRateLimitViolations
        expr: rate(rate_limit_violations_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of rate limit violations"
          description: "{{ $value }} violations/sec detected"

      # AI catalog fallback spike
      - alert: AICatalogFallbackSpike
        expr: rate(ai_catalog_fallback_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI catalog fallback spike"
          description: "Catalog fallback rate is {{ $value }} events/sec"

      # AI timeout fallback spike
      - alert: AITimeoutFallbackSpike
        expr: rate(ai_timeout_fallback_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI timeout fallback spike"
          description: "Timeout fallback rate is {{ $value }} events/sec"

      # AI stage regression guards firing
      - alert: AIStageRegressionSpike
        expr: rate(ai_stage_regression_blocked_total[5m]) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order stage regression spike"
          description: "Regression guard triggered at {{ $value }} events/sec"

      # AI repeated prompt spike
      - alert: AIRepeatPromptSpike
        expr: rate(ai_repeat_prompt_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI repeat prompt spike"
          description: "Repeat prompt rate is {{ $value }} events/sec"

      # AI escalation spike
      - alert: AIEscalationSpike
        expr: rate(ai_escalation_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI escalation spike"
          description: "Escalation rate is {{ $value }} events/sec"

