version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: brancr-postgres
    environment:
      POSTGRES_USER: brancr
      POSTGRES_PASSWORD: brancr_dev_password
      POSTGRES_DB: brancr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brancr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brancr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  brancr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brancr-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: 8080
      POSTGRES_DSN: postgres://brancr:brancr_dev_password@postgres:5432/brancr?sslmode=disable
      REDIS_ADDR: redis:6379
      TENANT_JWT_SECRET: dev-jwt-secret-key-must-be-at-least-32-characters-long-for-security
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
      ADMIN_JWT_SECRET: dev-admin-jwt-secret-key-must-be-at-least-32-characters-long
      ADMIN_SESSION_TTL_MINUTES: 480
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

