<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{block "title" .}}Dashboard — Brancr Admin{{end}}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Light mode colors */
      --bg-primary: #ffffff;
      --bg-secondary: #f9fafb;
      --bg-tertiary: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border-color: #e5e7eb;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --primary: #0A034B;
      --primary-hover: #0d045f;
      --accent: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --sidebar-bg: #ffffff;
      --sidebar-border: #e5e7eb;
      --nav-active: #f3f4f6;
      --nav-hover: #f9fafb;
    }

    [data-theme="dark"] {
      --bg-primary: #111827;
      --bg-secondary: #1f2937;
      --bg-tertiary: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --text-tertiary: #9ca3af;
      --border-color: #374151;
      --card-bg: #1f2937;
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
      --card-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
      --primary: #ffffff;
      --primary-hover: #e5e7eb;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --sidebar-bg: #1f2937;
      --sidebar-border: #374151;
      --nav-active: #374151;
      --nav-hover: #374151;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Header */
    header {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--card-shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .logo svg {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 14px;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      background: var(--nav-hover);
      color: var(--text-primary);
    }

    .logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Main Layout */
    main {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 65px);
    }

    /* Sidebar */
    nav {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-tertiary);
      padding: 0 12px;
      margin-bottom: 8px;
    }

    nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
    }

    nav a:hover {
      background: var(--nav-hover);
      color: var(--text-primary);
    }

    nav a.active {
      background: var(--accent);
      color: white;
    }
    
    [data-theme="dark"] nav a.active {
      background: var(--accent);
      color: white;
    }

    nav a svg {
      width: 18px;
      height: 18px;
    }

    /* Content Area */
    .content {
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .card:hover {
      box-shadow: var(--card-shadow-hover);
      transform: translateY(-2px);
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-card-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .stat-card-icon.blue { background: #dbeafe; color: #1e40af; }
    .stat-card-icon.green { background: #d1fae5; color: #065f46; }
    .stat-card-icon.purple { background: #e9d5ff; color: #6b21a8; }
    .stat-card-icon.orange { background: #fed7aa; color: #9a3412; }

    [data-theme="dark"] .stat-card-icon.blue { background: #1e3a8a; color: #dbeafe; }
    [data-theme="dark"] .stat-card-icon.green { background: #065f46; color: #d1fae5; }
    [data-theme="dark"] .stat-card-icon.purple { background: #6b21a8; color: #e9d5ff; }
    [data-theme="dark"] .stat-card-icon.orange { background: #9a3412; color: #fed7aa; }

    .stat-card-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-card-label {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-card-change {
      font-size: 12px;
      margin-top: 4px;
    }

    .stat-card-change.positive { color: var(--success); }
    .stat-card-change.negative { color: var(--danger); }

    /* Tables */
    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--bg-secondary);
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
    }

    tbody tr:hover {
      background: var(--bg-secondary);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* Buttons */
    button, .btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.primary, .btn-primary {
      background: var(--accent);
      color: white;
    }

    button.primary:hover, .btn-primary:hover {
      background: var(--accent);
      opacity: 0.9;
      transform: translateY(-1px);
    }
    
    [data-theme="dark"] button.primary,
    [data-theme="dark"] .btn-primary {
      background: var(--accent);
      color: white;
    }

    button.danger, .btn-danger {
      background: var(--danger);
      color: white;
    }

    button.danger:hover, .btn-danger:hover {
      opacity: 0.9;
    }

    /* Status badges */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge.success { background: #d1fae5; color: #065f46; }
    .badge.warning { background: #fed7aa; color: #9a3412; }
    .badge.danger { background: #fee2e2; color: #991b1b; }
    .badge.info { background: #dbeafe; color: #1e40af; }

    [data-theme="dark"] .badge.success { background: #065f46; color: #d1fae5; }
    [data-theme="dark"] .badge.warning { background: #9a3412; color: #fed7aa; }
    [data-theme="dark"] .badge.danger { background: #991b1b; color: #fee2e2; }
    [data-theme="dark"] .badge.info { background: #1e3a8a; color: #dbeafe; }

    /* Charts */
    .chart-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
      height: 400px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .chart-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .chart-container canvas {
      flex: 1;
      max-height: 320px;
      width: 100% !important;
      height: 100% !important;
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Responsive */
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
      nav {
        display: none;
      }
      .content {
        padding: 16px;
      }
    }
  </style>
</head>

  <script>
    // Theme toggle functionality
    function getTheme() {
      return localStorage.getItem('theme') || 'light';
    }

    function setTheme(theme) {
      localStorage.setItem('theme', theme);
      document.documentElement.setAttribute('data-theme', theme);
      updateThemeIcon(theme);
    }

    function toggleTheme() {
      const currentTheme = getTheme();
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      setTheme(newTheme);
    }

    function updateThemeIcon(theme) {
      const icon = document.getElementById('themeIcon');
      const text = document.getElementById('themeText');
      if (theme === 'dark') {
        icon.textContent = '☀️';
        text.textContent = 'Light';
      } else {
        icon.textContent = '🌙';
        text.textContent = 'Dark';
      }
    }

    // Initialize theme on page load
    setTheme(getTheme());
  </script>
